version: '3.8'

services:
  agent-demo:
    build: .
    container_name: multi-tool-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # SQLite数据库持久化，容器销毁不丢会话
      - ./agent.db:/app/agent.db
      # 知识库挂载，加文件不用重新打镜像
      - ./knowledge:/app/knowledge
      # 前端页面挂载，改前端不用重新打镜像
      - ./static:/app/static
      # 模型缓存挂载，避免每次重启重新下载
      - ./hf_cache:/root/.cache/huggingface
    restart: unless-stopped