

services:
  agent:
    build: .
    container_name: multi-model-agent-debate
    ports:
      # 宿主机端口:容器端口。8000 被占用时，在 .env 里设 APP_PORT=8080 即可
      - "${APP_PORT:-8000}:${SERVER_PORT:-8000}"
    env_file:
      - .env
    volumes:
      # 将原来的单文件挂载改为目录挂载
      # 代码目录挂载：改代码后只需 up -d，不用每次重建镜像
      # （镜像里已有依赖；生产环境建议去掉这两行，用 --build 固化版本）
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./run.py:/app/run.py
      - ./data:/app/data  
      - ./knowledge:/app/knowledge
      - ./static:/app/static
      # 模型缓存：优先复用宿主机的 HuggingFace 缓存（容器内下载常常失败）。
      # 没有缓存时设 HF_CACHE=./hf_cache，让容器自己下。
      - ${HF_CACHE:-./hf_cache}:/root/.cache/huggingface
    # 容器启动后模型要加载几十秒，所以 start_period 给足；探针直接打 /health
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # SSE 是长连接：不给超时的话，停止容器会一直等前端断开
    stop_grace_period: 10s
    restart: unless-stopped