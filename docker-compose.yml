

services:
  agent-demo:
    build: .
    container_name: multi-tool-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 将原来的单文件挂载改为目录挂载
      - ./data:/app/data  
      - ./knowledge:/app/knowledge
      - ./static:/app/static
      - ./hf_cache:/root/.cache/huggingface
    restart: unless-stopped