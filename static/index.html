<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模型研讨 Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
:root {
    --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #eef2ff;
    --violet: #7c3aed; --violet-light: #f5f3ff;
    --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --muted-2: #94a3b8;
    --line: #e8ecf3; --surface: #ffffff; --surface-2: #f8fafc;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --shadow: 0 10px 30px -12px rgba(15, 23, 42, .18);
    --shadow-lg: 0 28px 64px -24px rgba(15, 23, 42, .32);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    color: var(--ink);
    padding: 22px;
    background: linear-gradient(155deg, #e8ecfb 0%, #eef1fb 38%, #f4effc 68%, #fdf0f7 100%);
    height: 100%; display: flex; justify-content: center; align-items: center;
    position: relative; overflow: hidden;
    -webkit-font-smoothing: antialiased;
}
/* 背景光斑：纯装饰，不影响点击 */
body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(90px); opacity: .75;
}
body::before { width: 560px; height: 560px; left: -160px; top: -180px; background: #c7d2fe; }
body::after  { width: 520px; height: 520px; right: -150px; bottom: -170px; background: #e9d5ff; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #dbe2ee; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #c3ccdd; background-clip: content-box; }

/* ---------- 外壳 ---------- */
.app-container {
    width: 100%; max-width: 1180px; height: 100%; max-height: 1020px; display: flex;
    position: relative; z-index: 1;
    background: var(--surface); border-radius: 22px; overflow: hidden;
    box-shadow:
        0 40px 90px -40px rgba(49, 46, 129, .45),
        0 8px 26px -18px rgba(15, 23, 42, .28),
        0 0 0 1px rgba(99, 102, 241, .10),
        inset 0 1px 0 rgba(255, 255, 255, .9);
}

/* ---------- 侧边栏 ---------- */
.sidebar {
    width: 264px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(180deg, #fbfcff 0%, #f6f8fd 100%);
    border-right: 1px solid var(--line);
}
.sidebar-header { padding: 18px 14px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 12px; }
.brand-logo {
    width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 8px 18px -10px rgba(79, 70, 229, 1);
}
.brand-name { font-size: 13.5px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.brand-sub { font-size: 10.5px; color: var(--muted-2); letter-spacing: .04em; text-transform: uppercase; margin-top: 1px; }
.new-chat-btn {
    width: 100%; padding: 10px 12px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #6d28d9); color: #fff;
    font-size: 13px; font-weight: 600; font-family: inherit;
    transition: transform .15s, box-shadow .2s, filter .2s;
    box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .85);
}
.new-chat-btn:hover { transform: translateY(-1px); filter: brightness(1.07); box-shadow: 0 12px 24px -10px rgba(79, 70, 229, .95); }
.new-chat-btn:active { transform: translateY(0); }
.new-chat-btn.secondary { background: #fff; color: var(--violet); border: 1px solid #ddd6fe; box-shadow: none; }
.new-chat-btn.secondary:hover { background: var(--violet-light); box-shadow: 0 8px 18px -12px rgba(124, 58, 237, .9); }
.session-list { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 3px; }
.session-item {
    position: relative; padding: 9px 12px 9px 16px; border-radius: 10px; cursor: pointer;
    font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center;
    transition: background .16s, color .16s, box-shadow .16s;
}
.session-item:hover { background: #eef2ff; }
.session-item.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: var(--shadow-sm), 0 0 0 1px #e0e7ff; }
.session-item.active::before {
    content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; border-radius: 3px;
    background: linear-gradient(180deg, #4f46e5, #7c3aed);
}
.session-item > span:last-child { color: var(--muted-2) !important; font-size: 10.5px !important; }

/* ---------- 主区 ---------- */
.chat-container { flex: 1; min-width: 0; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.chat-header {
    padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    background: rgba(255, 255, 255, .78); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.chat-header .title {
    font-size: 17px; font-weight: 700; letter-spacing: -.01em;
    background: linear-gradient(90deg, #4f46e5, #7c3aed 55%, #db2777);
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.chat-header .subtitle { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.settings-btn {
    background: #f1f5f9; color: var(--ink-2); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 500; font-family: inherit;
    cursor: pointer; white-space: nowrap; transition: all .18s;
}
.settings-btn:hover { background: #fff; border-color: #c7d2fe; color: var(--primary); box-shadow: 0 8px 18px -12px rgba(79, 70, 229, .9); }

/* ---------- 研讨配置条 ---------- */
.group-info-bar {
    display: none; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 28px;
    background: linear-gradient(90deg, #f5f3ff, #eef2ff); border-bottom: 1px solid #e0e7ff; font-size: 12px;
    flex-shrink: 0;
}
.group-info-bar .gi-label { font-weight: 700; color: #6d28d9; font-size: 11.5px; letter-spacing: .02em; }
.gi-chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: #fff; border: 1px solid #ddd6fe; font-size: 11.5px; color: #5b21b6; box-shadow: var(--shadow-sm); }
.gi-chip.chief { border-color: #fed7aa; background: #fff7ed; color: #c2410c; font-weight: 700; }
.gi-staffs { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.gi-sep { width: 1px; height: 14px; background: #ddd6fe; margin: 0 2px; }

/* ---------- 快捷问法 ---------- */
.quick-btns { padding: 14px 28px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; background: #fcfdff; flex-shrink: 0; }
.quick-btn {
    padding: 7px 14px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
    font-size: 12.5px; color: var(--ink-2); font-family: inherit; cursor: pointer;
    transition: all .18s; box-shadow: var(--shadow-sm);
}
.quick-btn:hover { border-color: #c7d2fe; background: var(--primary-light); color: var(--primary); transform: translateY(-1px); box-shadow: 0 10px 20px -14px rgba(79, 70, 229, 1); }
.quick-btn:active { transform: translateY(0); }

/* ---------- 消息区 ---------- */
.chat-messages {
    flex: 1; padding: 26px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    background:
        radial-gradient(700px 320px at 100% 0%, rgba(224, 231, 255, .55) 0%, transparent 65%),
        linear-gradient(180deg, #fbfcff 0%, #f6f8fd 100%);
}
.chat-messages:empty::before {
    content: "👋 选个模型，或者点上面的快捷问题，开始和 Agent 对话吧";
    margin: auto; padding: 0 24px; color: var(--muted-2); font-size: 13.5px; text-align: center; line-height: 1.9;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.message {
    max-width: 76%; padding: 12px 16px; border-radius: 16px; line-height: 1.68; font-size: 14.8px;
    word-wrap: break-word; animation: msgIn .28s ease both;
}
.message.user {
    align-self: flex-end; white-space: pre-wrap; color: #fff; border-bottom-right-radius: 5px;
    background: linear-gradient(135deg, #4f46e5, #6d28d9);
    box-shadow: 0 14px 28px -18px rgba(79, 70, 229, 1);
}
.message.ai {
    align-self: flex-start; background: #fff; color: var(--ink); border: 1px solid var(--line);
    border-bottom-left-radius: 5px; box-shadow: var(--shadow-sm);
}

/* ---------- 思考 / 工具链路 ---------- */
.thinking-status {
    align-self: flex-start; display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid var(--line); color: var(--muted);
    font-size: 13.5px; padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 5px;
    box-shadow: var(--shadow-sm); animation: msgIn .28s ease both;
}
.thinking-dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #c7d2fe; margin-right: 3px; animation: bounce 1.4s infinite ease-in-out both; }
.thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
.thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
.thought-toggle {
    font-size: 11.5px; color: var(--muted); cursor: pointer; margin-top: 10px; user-select: none;
    display: none; width: fit-content; padding: 4px 10px; border-radius: 999px;
    background: #f1f5f9; transition: all .16s;
}
.thought-toggle:hover { background: var(--primary-light); color: var(--primary); }
.thought-content {
    margin-top: 8px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; font-size: 12px; line-height: 1.7; color: var(--ink-2);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    white-space: pre-wrap; display: none; max-height: 260px; overflow-y: auto;
}

/* ---------- 执行过程卡片 ---------- */
.step-card {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px;
    background: #fff; font-size: 12px; line-height: 1.6;
}
.step-card:last-child { margin-bottom: 0; }
.step-card.step-fail { border-color: #fecaca; background: #fef2f2; }
.step-card.step-route  { border-left: 3px solid #a5b4fc; }
.step-card.step-memory { border-left: 3px solid #6ee7b7; }
.step-card.step-tool   { border-left: 3px solid #fcd34d; }
.step-card.step-llm    { border-left: 3px solid #93c5fd; }
.step-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.step-name { font-weight: 600; color: var(--ink); font-family: ui-monospace, Consolas, monospace; }
.step-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-args, .step-result {
    margin-top: 5px; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; color: var(--ink-2); word-break: break-all;
}
.step-args { color: var(--muted); }
.step-result { border-top: 1px dashed var(--line); padding-top: 5px; }

/* ---------- 多模型研讨 ---------- */
.stage-divider {
    text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .03em;
    color: var(--violet); margin: 22px 0 6px; padding-bottom: 2px;
}
.stage-divider::after {
    content: ''; display: block; height: 1px; margin-top: 9px;
    background: linear-gradient(90deg, transparent, #ddd6fe, transparent);
}
.round-block { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.round-block .stage-divider { margin-top: 0; }
.discussion-msg { display: flex; gap: 10px; max-width: 92%; align-self: flex-start; margin-bottom: 12px; width: 100%; }
.model-avatar {
    width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #eef2ff, #f5f3ff); border: 1px solid #e0e7ff;
}
.model-content-wrapper {
    background: #fff; border: 1px solid var(--line); padding: 12px 14px; width: 100%;
    border-radius: 14px; border-top-left-radius: 5px; box-shadow: var(--shadow-sm);
}
.model-name-tag { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.summary-msg {
    border: 1px solid #fde68a; align-self: stretch; width: 100%; margin-top: 12px; padding: 18px;
    border-radius: 16px; background: linear-gradient(180deg, #fffdf5, #fffbeb);
    box-shadow: 0 18px 36px -28px rgba(217, 119, 6, .9);
}
.summary-title { color: #b45309; font-weight: 800; margin-bottom: 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }

/* ---------- Markdown ---------- */
.markdown-body { font-size: 14.5px; line-height: 1.75; overflow-wrap: break-word; }
.markdown-body > :first-child { margin-top: 0; }
.markdown-body > :last-child { margin-bottom: 0; }
.markdown-body p { margin-bottom: 10px; }
.markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 16px 0 8px; font-weight: 700; line-height: 1.35; }
.markdown-body h1 { font-size: 19px; }
.markdown-body h2 { font-size: 17px; }
.markdown-body h3 { font-size: 15.5px; }
.markdown-body ul, .markdown-body ol { padding-left: 22px; margin-bottom: 10px; }
.markdown-body li { margin: 3px 0; }
.markdown-body strong { font-weight: 700; color: #0b1220; }
.markdown-body code { background: var(--primary-light); color: #4338ca; padding: 1px 6px; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.markdown-body pre { background: #0f172a; color: #e2e8f0; padding: 14px 16px; border-radius: 12px; overflow-x: auto; margin-bottom: 10px; }
.markdown-body pre code { background: transparent; color: inherit; padding: 0; font-size: 12.5px; line-height: 1.6; }
.markdown-body blockquote { border-left: 3px solid #c7d2fe; padding: 2px 0 2px 12px; color: var(--muted); margin-bottom: 10px; }
.markdown-body table { border-collapse: collapse; width: 100%; margin-bottom: 10px; font-size: 13.5px; }
.markdown-body th, .markdown-body td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
.markdown-body th { background: var(--surface-2); font-weight: 700; }
.markdown-body a { color: var(--primary); text-decoration: none; border-bottom: 1px solid #c7d2fe; }
.markdown-body hr { border: none; height: 1px; background: var(--line); margin: 14px 0; }

/* ---------- 输入区 ---------- */
.input-wrapper { padding: 14px 28px 20px; border-top: 1px solid var(--line); background: #fff; flex-shrink: 0; }
.input-toolbar { display: flex; align-items: center; margin-bottom: 10px; gap: 14px; }
.model-select-wrapper { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.model-select {
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
    font-size: 12.5px; color: var(--ink-2); font-family: inherit; cursor: pointer; outline: none; transition: all .16s;
}
.model-select:hover, .model-select:focus { background: #fff; border-color: #c7d2fe; }
.web-search-switch {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; transition: background .16s;
}
.web-search-switch:hover { background: var(--surface-2); }
.web-search-switch input { accent-color: var(--primary); cursor: pointer; }
.chat-input-area {
    display: flex; gap: 10px; align-items: flex-end; padding: 8px 8px 8px 16px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px;
    transition: background .18s, border-color .18s, box-shadow .18s;
}
.chat-input-area:focus-within { background: #fff; border-color: #c7d2fe; box-shadow: 0 0 0 4px rgba(79, 70, 229, .10); }
#userInput {
    flex: 1; padding: 8px 0; border: none; background: transparent; outline: none;
    font-size: 15px; font-family: inherit; color: var(--ink); min-height: 34px; max-height: 120px;
}
#userInput::placeholder { color: var(--muted-2); }
#sendBtn {
    width: 40px; height: 40px; min-width: 40px; border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    transition: transform .15s, filter .2s, box-shadow .2s;
    box-shadow: 0 10px 20px -12px rgba(79, 70, 229, 1);
}
#sendBtn svg { width: 18px; height: 18px; }
#sendBtn:hover { transform: translateY(-1px); filter: brightness(1.07); }
#sendBtn:active { transform: translateY(0) scale(.97); }
#sendBtn.stop-state { background: linear-gradient(135deg, #475569, #1e293b); box-shadow: 0 10px 20px -14px rgba(15, 23, 42, .9); }

/* ---------- 附件上传 ---------- */
.attach-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    font-size: 12.5px; font-family: inherit; cursor: pointer; transition: all .16s;
}
.attach-btn:hover { border-color: #c7d2fe; background: var(--primary-light); color: var(--primary); }
.attach-btn.busy { opacity: .6; pointer-events: none; }
.attach-chip {
    display: none; align-items: center; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px; padding: 8px 12px; border-radius: 10px;
    background: var(--primary-light); border: 1px solid #e0e7ff; font-size: 12.5px; color: #4338ca;
}
.attach-name { font-weight: 600; }
.attach-meta { color: var(--muted); }
.attach-warn { color: #b45309; }
.attach-remove {
    margin-left: auto; border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; font-family: inherit;
}
.attach-remove:hover { background: #fff; color: #dc2626; }

/* ---------- 研讨配置面板 ---------- */
#groupSetupPanel {
    display: none; flex: 1; flex-direction: column; gap: 16px; padding: 24px;
    background:
        radial-gradient(700px 320px at 100% 0%, rgba(224, 231, 255, .55) 0%, transparent 65%),
        linear-gradient(180deg, #fbfcff, #f5f7fd);
    justify-content: flex-start; align-items: center; overflow-y: auto;
}
.setup-card { width: 100%; max-width: 520px; margin: auto 0; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 26px; box-shadow: var(--shadow); }
.setup-card h3 { margin-bottom: 18px; color: var(--ink); text-align: center; font-size: 16px; font-weight: 700; }
.setup-group { margin-bottom: 16px; }
.setup-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.setup-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; background: var(--surface-2); font-family: inherit; outline: none; }
.setup-tips { font-size: 11.5px; color: var(--muted-2); line-height: 1.8; }
.staff-checkbox { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
.start-btn {
    width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff;
    font-size: 14.5px; font-weight: 600; font-family: inherit;
    transition: transform .15s, filter .2s, box-shadow .2s;
    box-shadow: 0 14px 28px -16px rgba(124, 58, 237, 1);
}
.start-btn:hover { transform: translateY(-1px); filter: brightness(1.07); }

/* ---------- 设置弹窗 ---------- */
.modal-overlay {
    position: fixed; inset: 0; z-index: 1000; padding: 20px;
    background: rgba(15, 23, 42, .42); backdrop-filter: blur(3px);
    display: none; justify-content: center; align-items: center;
}
.modal-content {
    width: 440px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 26px;
    background: #fff; border-radius: 18px; box-shadow: var(--shadow-lg);
    animation: msgIn .22s ease both;
}
.modal-content h3 { font-size: 16px; font-weight: 700; }
.modal-content label { display: block; margin-top: 14px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.modal-content input, .modal-content select {
    width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface-2); font-size: 13.5px; font-family: inherit; outline: none; transition: all .16s;
}
.modal-content input:focus, .modal-content select:focus { background: #fff; border-color: #c7d2fe; box-shadow: 0 0 0 4px rgba(79, 70, 229, .10); }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.modal-btns button { padding: 9px 18px; border: none; border-radius: 10px; font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .16s; }
.btn-cancel { background: #f1f5f9; color: var(--ink-2); }
.btn-cancel:hover { background: #e2e8f0; }
.btn-save { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; box-shadow: 0 10px 20px -14px rgba(79, 70, 229, 1); }
.btn-save:hover { filter: brightness(1.06); }

/* ---------- 窄屏 ---------- */

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">🧠</div>
                    <div>
                        <div class="brand-name">多模型研讨 Agent</div>
                        <div class="brand-sub">Multi-Model Debate</div>
                    </div>
                </div>
                <button class="new-chat-btn" onclick="createNewChat()">＋ 新对话（普通）</button>

            </div>
            <div class="session-list" id="sessionList"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <div class="title" id="chatTitle">多模型研讨 Agent</div>
                    <div class="subtitle" id="chatSubtitle">基于 LangGraph + ReAct | 深度流式输出</div>
                </div>
                <button class="settings-btn" onclick="openSettings()">⚙️ 自定义配置</button>
            </div>

            <!-- 多模型研讨会话的配置条：一眼看出主模型 / 副模型 -->
            <div class="group-info-bar" id="groupInfoBar">
                <span class="gi-label">👑 主模型</span>
                <span class="gi-chip chief" id="giChief">-</span>
                <span class="gi-sep"></span>
                <span class="gi-label">👥 副模型</span>

            <div class="quick-btns" id="quickBtns">

                <button class="quick-btn" onclick="quickSend('计算 (12+28)*3')">计算 (12+28)*3</button>
                <button class="quick-btn" onclick="quickSend('现在几点')">现在几点</button>
                <button class="quick-btn" onclick="quickSend('帮我查一下核心硬件的型号是什么？')">查设备型号</button>
                <button class="quick-btn" onclick="quickSend('最近有什么 AI 新闻？')">最近AI新闻</button>
            </div>

            <div class="chat-messages" id="chatMessages"></div>
            
            <div id="groupSetupPanel">
                <div class="setup-card">
                    <h3>🧠 配置多模型研讨</h3>
                    <div class="setup-group">
                        <label>👑 首席总结模型 (主模型)</label>
                        <select id="chiefModelSelect"></select>
                    </div>
                    <div class="setup-group">
                        <label>👥 研讨专家模型 (副模型，选2-3个)</label>
                        <div id="staffModelsCheckboxes" style="display:flex; flex-direction:column; gap:8px;"></div>
                    </div>
                    <div class="setup-group">
                        <label>⚙️ 运行模式</label>
                        <select id="groupModeSelect">
                            <option value="debate" selected>研讨：独立作答 → 交叉互评 → 首席总结（质量优先）</option>
                            <option value="parallel">并行对比：只作答 → 自动找共识与分歧（速度优先）</option>
                        </select>
                    </div>
                    <div class="setup-tips">提示：主模型不可与副模型重复。配置发送首条消息后将锁定。</div>
                    <button class="start-btn" onclick="startGroupChatSession()">开始研讨</button>
                </div>
            </div>

            <div class="input-wrapper" id="inputWrapper" style="display: none;">
                <div class="input-toolbar">
                    <div class="model-select-wrapper" id="modelSelectWrapper">
                        <span>🤖 模型:</span>
                        <select id="modelSelect" class="model-select">
                            <option value="custom">跟随右上角配置</option>
                        </select>
                    </div>
                    <label class="web-search-switch" id="webSearchLabel">
                        <input type="checkbox" id="webSearchToggle" onchange="toggleWebSearch()"> 🌐 联网搜索
                    </label>
                    <button type="button" class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="上传 Word / PDF，然后针对文档提问">📎 文档</button>
                    <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.csv" style="display:none" onchange="handleFileSelect(this)">
                </div>
                <div class="attach-chip" id="attachChip" style="display:none;"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="输入你的问题，按回车发送..." autocomplete="off">
                    <button id="sendBtn" onclick="handleSendClick()">
                        <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                        <svg id="stopIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h3>自定义模型配置</h3>
            <label>选择模型厂商</label>
            <select id="llmProvider" onchange="changeProvider()">
                <option value="">-- 请选择 --</option>
                <option value="qwen">通义千问</option>
                <option value="glm">智谱 GLM</option>
                <option value="deepseek">DeepSeek</option>
                <option value="kimi">月之暗面 Kimi</option>
                <option value="doubao">豆包 (火山方舟)</option>
                <option value="openai">OpenAI (第三方中转)</option>
                <option value="anthropic">Anthropic (中转 Claude)</option>
            </select>
            <label>接口地址</label>
            <input type="text" id="userBaseUrl">
            <label>模型名称</label>
            <input type="text" id="userModelName">
            <label>API Key (仅保存在本地)</label>
            <input type="password" id="userApiKey">
            <div style="margin-top: 14px;">
                <button class="btn-save" style="width: 100%; background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe;" onclick="checkModelHealth()">🔍 检测已配置模型是否可用</button>
                <div id="healthResult" style="margin-top: 8px; font-size: 12px; line-height: 1.8; color: #374151;"></div>
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn-save" onclick="saveSettings()">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('agent_session_id') || null;
        let isGroupMode = false; 
        let groupConfig = null;  
        let allModels = [];      

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sendIcon = document.getElementById('sendIcon');
        const stopIcon = document.getElementById('stopIcon');
        const sessionList = document.getElementById('sessionList');
        
        const chatTitle = document.getElementById('chatTitle');
        const chatSubtitle = document.getElementById('chatSubtitle');
        const quickBtns = document.getElementById('quickBtns');
        const groupSetupPanel = document.getElementById('groupSetupPanel');
        const inputWrapper = document.getElementById('inputWrapper');
        const modelSelectWrapper = document.getElementById('modelSelectWrapper');

        const API_KEY = 'my-secret-key-123';
        // 默认选中的单模型（可用 localStorage 覆盖）
        const DEFAULT_MODEL_ID = 'qwen-plus';

        // 安全渲染 Markdown：CDN 不可用或解析异常时退化为纯文本，绝不把内容吞掉
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        // 模型输出不可信：把 on* 事件、script/iframe 之类、javascript: 链接全部摘掉；
        // 保留 <br>、<b> 这类正常排版标签（GLM 等模型会直接吐 HTML）。
        function sanitizeHtml(html) {
            try {
                const box = document.createElement('div');
                box.innerHTML = html;
                const drop = box.querySelectorAll('script,style,iframe,object,embed,link,meta,form');
                Array.prototype.forEach.call(drop, n => n.parentNode && n.parentNode.removeChild(n));
                const all = box.querySelectorAll('*');
                Array.prototype.forEach.call(all, node => {
                    Array.prototype.slice.call(node.attributes || []).forEach(attr => {
                        const an = String(attr.name).toLowerCase();
                        const av = String(attr.value || '').replace(/\s+/g, '').toLowerCase();
                        if (an.indexOf('on') === 0) node.removeAttribute(attr.name);
                        else if ((an === 'href' || an === 'src') && av.indexOf('javascript:') === 0) node.removeAttribute(attr.name);
                    });
                });
                return box.innerHTML;
            } catch (e) {
                return escapeHtml(html);
            }
        }
        // 渲染 Markdown：marked 不可用（CDN 被墙/离线）或解析异常时降级为纯文本，绝不吞内容。
        function renderMarkdown(text) {
            const raw = (text === null || text === undefined) ? '' : String(text);
            try {
                if (window.marked && typeof window.marked.parse === 'function') {
                    return sanitizeHtml(window.marked.parse(raw));
                }
            } catch (e) {
                console.warn('Markdown 渲染失败，已降级为纯文本', e);
            }
            return escapeHtml(raw).replace(/\r?\n/g, '<br>');
        }
        let isGenerating = false;
        let currentAbortController = null;
        let typingIntervals = {};

        // 名字匹配是「包含」判断，越具体的 key 要放越前面（gpt-6.1 要排在 gpt-6 之前）
        const modelVisualConfig = {
            'kimi': { name: 'Kimi', icon: '🌙', color: '#8b5cf6' },
            'moonshot': { name: 'Kimi', icon: '🌙', color: '#8b5cf6' },
            'qwen': { name: '通义', icon: '☁️', color: '#ff6a00' },
            'glm': { name: '智谱', icon: '🧠', color: '#10b981' },
            'deepseek': { name: 'DeepSeek', icon: '🐋', color: '#4f46e5' },
            'doubao': { name: '豆包', icon: '🫘', color: '#3b82f6' },
            'volc': { name: '豆包', icon: '🫘', color: '#3b82f6' },
            'sonnet': { name: 'Claude Sonnet', icon: '🎭', color: '#d97757' },
            'opus': { name: 'Claude Opus', icon: '🎩', color: '#b45309' },
            'haiku': { name: 'Claude Haiku', icon: '🍃', color: '#059669' },
            'claude': { name: 'Claude', icon: '🎭', color: '#d97757' },
            'gpt-6.1': { name: 'GPT-6.1', icon: '🌟', color: '#0ea5e9' },
            'gpt-6': { name: 'GPT-6', icon: '✨', color: '#10a37f' },
            'gpt-5.6': { name: 'GPT-5.6', icon: '💫', color: '#6366f1' },
            'gpt': { name: 'GPT', icon: '✨', color: '#10a37f' },
            'default': { name: 'AI', icon: '🤖', color: '#6b7280' }
        };
        function getModelVisual(modelName) {
            if (!modelName) return modelVisualConfig['default'];
            for (const key in modelVisualConfig) {
                if (modelName.toLowerCase().includes(key.toLowerCase())) return modelVisualConfig[key];
            }
            return modelVisualConfig['default'];
        }

        async function init() {
            await loadModels(); 
            await loadSessionList();
            if (sessionId) {
                restoreGroupConfig(sessionId);
                updateLayoutForMode();
                await loadHistory(sessionId);
            } else {
                createNewChat();
            }
        }

        async function loadModels() {
            try {
                const res = await fetch('/models');
                const data = await res.json();
                if (data.code === 200) {
                    allModels = data.data;
                    const modelSelect = document.getElementById('modelSelect');
                    // 保留“跟随右上角配置”这一项，但挪到最后，默认不再选中它
                    const customOpt = modelSelect.querySelector('option[value="custom"]');
                    modelSelect.innerHTML = '';
                    allModels.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.model_id;
                        opt.textContent = `${m.label} (${m.vendor})`;
                        modelSelect.appendChild(opt);
                    });
                    if (customOpt) modelSelect.appendChild(customOpt);

                    // 默认选中千问（用户上次手动选过的优先）
                    const saved = localStorage.getItem('selected_model');
                    const preferred = saved || DEFAULT_MODEL_ID;
                    if (allModels.some(m => m.model_id === preferred)) {
                        modelSelect.value = preferred;
                    } else if (allModels.length > 0) {
                        modelSelect.value = allModels[0].model_id;
                    }
                    modelSelect.onchange = () => localStorage.setItem('selected_model', modelSelect.value);

                    buildGroupSetupPanel();
                }
            } catch (e) { console.error('加载模型失败', e); }
        }

        function modelDisplayName(id) {
            if (!id) return '未知模型';
            const m = (allModels || []).find(x => x.model_id === id);
            return m ? m.label : id;
        }

        // 聊天区顶部显示当前研讨会话的主/副模型
        function updateGroupInfoBar() {
            const bar = document.getElementById('groupInfoBar');
            if (!bar) return;
            if (!isGroupMode || !groupConfig) { bar.style.display = 'none'; return; }
            const chief = document.getElementById('giChief');
            if (chief) chief.textContent = modelDisplayName(groupConfig.chief);
            const box = document.getElementById('giStaffs');
            if (box) {
                box.innerHTML = '';
                (groupConfig.staffs || []).forEach(s => {
                    const chip = document.createElement('span');
                    chip.className = 'gi-chip';
                    chip.textContent = modelDisplayName(s);
                    box.appendChild(chip);
                });
            }
            bar.style.display = 'flex';
        }

        function rememberGroupConfig(id) {
            if (!id || !groupConfig) return;
            try { localStorage.setItem('group_cfg_' + id, JSON.stringify(groupConfig)); } catch (e) {}
        }

        // 切回历史会话时恢复“这是不是研讨会话”
        function restoreGroupConfig(id) {
            const raw = id ? localStorage.getItem('group_cfg_' + id) : null;
            if (raw) {
                try { groupConfig = JSON.parse(raw); isGroupMode = true; return; } catch (e) {}
            }
            groupConfig = null;
            isGroupMode = false;
        }

        function updateLayoutForMode() {
            updateGroupInfoBar();
            if (isGroupMode) {
                chatTitle.textContent = "多模型研讨会议";
                chatSubtitle.textContent = "专家独立作答 -> 交叉讨论 -> 首席总结";
                quickBtns.style.display = 'none';
                modelSelectWrapper.style.display = 'none'; 
                if (groupConfig) {
                    chatMessages.style.display = '';
                    groupSetupPanel.style.display = 'none';
                    inputWrapper.style.display = 'block';
                } else {
                    // 配置阶段把消息区让出来，否则两者各占一半高度，
                    // 上面的空状态文案和下面的配置卡会挤在一起（主模型选择被顶出可视区）
                    chatMessages.style.display = 'none';
                    groupSetupPanel.style.display = 'flex';
                    inputWrapper.style.display = 'none';
                }
            } else {
                chatTitle.textContent = "多模型研讨 Agent";
                chatSubtitle.textContent = "基于 LangGraph + ReAct | 深度流式输出";
                quickBtns.style.display = 'flex';
                modelSelectWrapper.style.display = 'flex';
                chatMessages.style.display = '';
                groupSetupPanel.style.display = 'none';
                inputWrapper.style.display = 'block';
            }
        }

        function createNewChat() {
            if (isGenerating) return;
            isGroupMode = false;
            groupConfig = null;
            sessionId = null;
            localStorage.removeItem('agent_session_id');
            updateLayoutForMode();
            chatMessages.innerHTML = '<div class="message ai">你好！我已经准备好了。你可以问我天气、算数、时间，或者查阅内部知识库。</div>';
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            userInput.focus();
        }

        function createGroupChat() {
            if (isGenerating) return;
            isGroupMode = true;
            groupConfig = null;
            sessionId = null;
            localStorage.removeItem('agent_session_id');
            chatMessages.innerHTML = '';
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            updateLayoutForMode();
        }

        function buildGroupSetupPanel() {
            const chiefSelect = document.getElementById('chiefModelSelect');
            const staffContainer = document.getElementById('staffModelsCheckboxes');
            chiefSelect.innerHTML = '';
            staffContainer.innerHTML = '';

            allModels.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.model_id;
                opt.textContent = `${m.label} (${m.vendor})`;
                chiefSelect.appendChild(opt);

                const label = document.createElement('label');
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '8px';
                label.style.cursor = 'pointer';
                label.innerHTML = `<input type="checkbox" value="${m.model_id}" class="staff-checkbox"> ${m.label} (${m.vendor})`;
                staffContainer.appendChild(label);
            });

            chiefSelect.addEventListener('change', () => {
                const chiefVal = chiefSelect.value;
                document.querySelectorAll('.staff-checkbox').forEach(cb => {
                    if (cb.value === chiefVal) {
                        cb.checked = false;
                        cb.disabled = true;
                    } else {
                        cb.disabled = false;
                    }
                });
            });
            chiefSelect.dispatchEvent(new Event('change'));
        }

        function startGroupChatSession() {
            const chiefModel = document.getElementById('chiefModelSelect').value;
            const staffCheckboxes = document.querySelectorAll('.staff-checkbox:checked');
            const staffModels = Array.from(staffCheckboxes).map(cb => cb.value);

            if (staffModels.length < 2 || staffModels.length > 3) {
                alert('请选择 2 到 3 个副模型！');
                return;
            }

            const groupMode = (document.getElementById('groupModeSelect') || {}).value || 'debate';
            groupConfig = { chief: chiefModel, staffs: staffModels, mode: groupMode };
            updateLayoutForMode();
            chatMessages.innerHTML = `<div class="message ai">✅ 研讨配置完成。主模型: ${chiefModel} | 副模型: ${staffModels.join(', ')}。<br>请在下方输入您的议题，开始研讨。</div>`;
            userInput.focus();
        }

        function handleSendClick() {
            if (isGenerating) {
                if (currentAbortController) currentAbortController.abort();
            } else {
                if (isGroupMode) {
                    sendGroupMessage();
                } else {
                    sendMessage();
                }
            }
        }

        function updateButtonState(generating) {
            isGenerating = generating;
            if (generating) {
                sendBtn.classList.add('stop-state');
                sendIcon.style.display = 'none';
                stopIcon.style.display = 'block';
            } else {
                sendBtn.classList.remove('stop-state');
                sendIcon.style.display = 'block';
                stopIcon.style.display = 'none';
            }
        }

        function typewriterEffect(element, text, speed = 20) {
            if (!element) return;
            const id = 'type-' + Math.random().toString(36).substr(2, 9);
            typingIntervals[id] = true;
            
            let i = 0;
            element.textContent = ""; 
            element.style.color = '#374151'; 
            
            let cleanText = (text === null || text === undefined ? '' : String(text)).trim();
            if (cleanText.startsWith('```markdown') || cleanText.startsWith('```')) {
                cleanText = cleanText.replace(/^```(?:markdown)?\n?/, '').replace(/\n?```$/, '');
            }

            const timer = setInterval(() => {
                if (!typingIntervals[id]) {
                    clearInterval(timer);
                    element.innerHTML = renderMarkdown(cleanText); 
                    return;
                }
                
                const step = cleanText.length > 300 ? 6 : 3; 
                i += step;
                
                if (i >= cleanText.length) {
                    i = cleanText.length;
                    clearInterval(timer);
                    delete typingIntervals[id];
                }

                const currentText = cleanText.slice(0, i);
                element.textContent = currentText;
                chatMessages.scrollTop = chatMessages.scrollHeight;

                if (i >= cleanText.length) {
                    element.innerHTML = renderMarkdown(cleanText);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            }, speed);
        }

        // ==================== 多模型研讨 ====================
        // 每一轮各自一个容器，"轮次::模型" 作为唯一键：
        // 后一轮永远只往自己的容器里写，物理上不可能覆盖前一轮的 DOM。
        async function sendGroupMessage() {
            let text = userInput.value.trim();
            if ((!text && !attachedDoc) || isGenerating || !groupConfig) return;
            if (!text && attachedDoc) text = '请各位专家阅读这份文档，讨论其中的要点与潜在风险。';

            const docId = attachedDoc ? attachedDoc.doc_id : null;
            const docLabel = attachedDoc ? '📎 ' + attachedDoc.filename + '\n' : '';

            addMessage(docLabel + text, 'user');
            userInput.value = '';
            clearAttachment();
            updateButtonState(true);

            currentAbortController = new AbortController();

            let currentLoadingDiv = document.createElement('div');
            currentLoadingDiv.className = 'thinking-status';
            currentLoadingDiv.innerHTML = '正在召唤专家，请稍候<span class="thinking-dots"><span></span><span></span><span></span></span>';
            chatMessages.appendChild(currentLoadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const roundBlocks = new Map();   // 轮次 -> 容器 div
            const roundBubbles = new Map();  // "轮次::模型" -> 文本节点
            let currentRound = 1;
            let summaryBubble = null;

            function scrollBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

            function createBlock(round, label) {
                const block = document.createElement('div');
                block.className = 'round-block';
                const divider = document.createElement('div');
                divider.className = 'stage-divider';
                divider.textContent = '— ' + label + ' —';
                block.appendChild(divider);
                chatMessages.appendChild(block);
                roundBlocks.set(round, block);
                return block;
            }

            function ensureBlock(round) {
                if (roundBlocks.has(round)) return roundBlocks.get(round);
                return createBlock(round, '第 ' + round + ' 部分');
            }

            function ensureBubble(round, model) {
                const key = round + '::' + model;
                if (roundBubbles.has(key)) return roundBubbles.get(key);
                const block = ensureBlock(round);
                const visual = getModelVisual(model);
                const msgWrapper = document.createElement('div');
                msgWrapper.className = 'discussion-msg';
                msgWrapper.innerHTML = `
                    <div class="model-avatar" style="background-color: ${visual.color}20; color: ${visual.color}; border: 1px solid ${visual.color}50;">${visual.icon}</div>
                    <div class="model-content-wrapper">
                        <div class="model-name-tag" style="color: ${visual.color};">${visual.name}${round === 2 ? ' · 研讨' : ''}</div>
                        <div class="markdown-body message-text" style="color: #9ca3af;">思考中<span class="thinking-dots"><span></span><span></span><span></span></span></div>
                    </div>
                `;
                block.appendChild(msgWrapper);
                const textEl = msgWrapper.querySelector('.message-text');
                roundBubbles.set(key, textEl);
                scrollBottom();
                return textEl;
            }

            function ensureSummary(model) {
                if (summaryBubble) return summaryBubble;
                const block = ensureBlock(currentRound);
                const visual = getModelVisual(model);
                const summaryWrapper = document.createElement('div');
                summaryWrapper.className = 'summary-msg';
                summaryWrapper.innerHTML = `
                    <div class="summary-title">👑 首席总结 (${visual.name})</div>
                    <div class="markdown-body message-text" style="color: #9ca3af;">正在提炼结论<span class="thinking-dots"><span></span><span></span><span></span></span></div>
                `;
                block.appendChild(summaryWrapper);
                summaryBubble = summaryWrapper.querySelector('.message-text');
                scrollBottom();
                return summaryBubble;
            }

            try {
                const response = await fetch('/chat/group_stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify({ 
                        message: text, 
                        chief_model: groupConfig.chief,
                        staff_models: groupConfig.staffs,
                        session_id: sessionId,
                        attachment_id: docId,
                        mode: (groupConfig && groupConfig.mode) || 'debate'
                    }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error('服务器返回异常: ' + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        let payload;
                        try {
                            payload = JSON.parse(line.slice(6));
                        } catch (err) {
                            console.warn('无法解析的流式帧', line);
                            continue;
                        }

                        if (payload.event === 'stage') {
                            if (currentLoadingDiv) { currentLoadingDiv.remove(); currentLoadingDiv = null; }
                            const label = payload.data || '';
                            let round = 3;
                            if (label.includes('第一轮')) round = 1;
                            else if (label.includes('第二轮')) round = 2;
                            currentRound = round;
                            // 同一轮重复的分隔帧直接忽略，避免把已渲染的内容顶掉
                            const existed = roundBlocks.get(round);
                            if (!existed || existed.children.length <= 1) {
                                createBlock(round, label);
                            }
                            scrollBottom();
                        }
                        else if (payload.event === 'init_models') {
                            (payload.models || []).forEach(m => ensureBubble(currentRound, m));
                        }
                        else if (payload.event === 'init_summary') {
                            if (currentLoadingDiv) { currentLoadingDiv.remove(); currentLoadingDiv = null; }
                            ensureSummary(payload.model);
                        }
                        else if (payload.event === 'speak') {
                            // 用帧里自带的 stage 定位轮次，不依赖 currentStage 的到达顺序
                            const round = payload.stage || currentRound;
                            const targetDiv = ensureBubble(round, payload.model);
                            typewriterEffect(targetDiv, payload.content || '');
                        }
                        else if (payload.event === 'summary') {
                            const targetDiv = ensureSummary(payload.model);
                            typewriterEffect(targetDiv, payload.content || '');
                        }
                        else if (payload.event === 'divergence') {
                            if (currentLoadingDiv) { currentLoadingDiv.remove(); currentLoadingDiv = null; }
                            const wrap = document.createElement('div');
                            wrap.className = 'summary-msg';
                            wrap.innerHTML = '<div class="summary-title">🔍 共识与分歧（自动分析）</div>' +
                                '<div class="markdown-body message-text" style="color:#9ca3af;">分析中...</div>';
                            chatMessages.appendChild(wrap);
                            typewriterEffect(wrap.querySelector('.message-text'), payload.content || '');
                            scrollBottom();
                        }
                        else if (payload.event === 'error') {
                            if (currentLoadingDiv) { currentLoadingDiv.remove(); currentLoadingDiv = null; }
                            const errDiv = document.createElement('div');
                            errDiv.className = 'message ai';
                            errDiv.textContent = '研讨失败：' + (payload.data || '未知错误');
                            chatMessages.appendChild(errDiv);
                            scrollBottom();
                        }
                        else if (payload.event === 'done') {
                            sessionId = payload.session_id;
                            localStorage.setItem('agent_session_id', sessionId);
                            rememberGroupConfig(sessionId);   // 记住这个会话的主/副模型
                            await loadSessionList();
                        }
                    }
                }
            } catch (e) {
                if (currentLoadingDiv) currentLoadingDiv.remove();
                if (e.name !== 'AbortError') addMessage('请求失败: ' + (e.message || '网络连接异常'), 'ai');
            } finally {
                // 让所有打字机把剩余内容一次性打完，避免“最后一段不显示”
                for (const k in typingIntervals) { typingIntervals[k] = false; }
                typingIntervals = {};
                updateButtonState(false);
                currentAbortController = null;
                userInput.focus();
            }
        }

        // ==================== 附件（Word / PDF） ====================
        let attachedDoc = null;
        const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function handleFileSelect(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            const chip = document.getElementById('attachChip');
            if (file.size > MAX_UPLOAD_BYTES) {
                attachedDoc = null;
                chip.style.display = 'flex';
                chip.innerHTML = '<span class="attach-warn">⚠️ 文件超过 15MB</span><button class="attach-remove" onclick="clearAttachment()">✕</button>';
                return;
            }
            const btn = document.getElementById('attachBtn');
            btn.classList.add('busy');
            chip.style.display = 'flex';
            chip.innerHTML = '<span class="attach-name">⏳ 正在解析 ' + escapeHtml(file.name) + ' …</span>';

            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    const res = await fetch('/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                        body: JSON.stringify({ filename: file.name, content_base64: reader.result })
                    });
                    const data = await res.json();
                    if (!res.ok || data.code !== 200) throw new Error((data && data.message) || ('HTTP ' + res.status));
                    attachedDoc = data.data;
                    chip.innerHTML =
                        '<span class="attach-name">📎 ' + escapeHtml(attachedDoc.filename) + '</span>' +
                        '<span class="attach-meta">' + escapeHtml(attachedDoc.kind) + ' · ' + attachedDoc.chars.toLocaleString() + ' 字</span>' +
                        (attachedDoc.warning ? '<span class="attach-warn">⚠️ ' + escapeHtml(attachedDoc.warning) + '</span>' : '') +
                        '<button class="attach-remove" onclick="clearAttachment()" title="移除附件">✕</button>';
                } catch (e) {
                    attachedDoc = null;
                    chip.innerHTML = '<span class="attach-warn">⚠️ ' + escapeHtml(e.message || '上传失败') + '</span>' +
                        '<button class="attach-remove" onclick="clearAttachment()">✕</button>';
                } finally {
                    btn.classList.remove('busy');
                }
            };
            reader.onerror = () => {
                attachedDoc = null;
                btn.classList.remove('busy');
                chip.innerHTML = '<span class="attach-warn">⚠️ 读取本地文件失败</span>';
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            attachedDoc = null;
            const chip = document.getElementById('attachChip');
            if (chip) { chip.style.display = 'none'; chip.innerHTML = ''; }
        }

        const STEP_ICONS = { route: '🧭', memory: '🧠', tool: '⚙', llm: '⚡' };

        function renderSteps(steps) {
            if (!steps || !steps.length) return '';
            return steps.map(s => {
                const type = s.type || 'tool';
                const icon = STEP_ICONS[type] || '⚙';
                const hasArgs = s.args && Object.keys(s.args).length;
                // 只有工具调用才叫"参数"，路由/记忆/生成是补充信息
                const args = hasArgs ? (type === 'tool' ? '参数：' : '') + escapeHtml(JSON.stringify(s.args)) : '';
                const dur = (s.duration_ms === null || s.duration_ms === undefined) ? '' : s.duration_ms + ' ms';
                const res = escapeHtml(String(s.result || '')).replace(/\n/g, '<br>');
                return '<div class="step-card step-' + type + (s.ok ? '' : ' step-fail') + '">' +
                    '<div class="step-head"><span class="step-name">' + icon + ' ' + escapeHtml(s.name) + '</span>' +
                    '<span class="step-time">' + dur + '</span></div>' +
                    (args ? '<div class="step-args">' + args + '</div>' : '') +
                    (res ? '<div class="step-result">' + res + '</div>' : '') +
                    '</div>';
            }).join('');
        }

        async function sendMessage() {
            let text = userInput.value.trim();
            if ((!text && !attachedDoc) || isGenerating) return;
            if (!text && attachedDoc) text = '请阅读这份文档，并总结其中的要点。';

            const docId = attachedDoc ? attachedDoc.doc_id : null;
            const docLabel = attachedDoc ? '📎 ' + attachedDoc.filename + '\n' : '';

            addMessage(docLabel + text, 'user');
            userInput.value = '';
            clearAttachment();
            updateButtonState(true); 
            
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-status';
            thinkingDiv.innerHTML = '正在思考<span class="thinking-dots"><span></span><span></span><span></span></span>';
            chatMessages.appendChild(thinkingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            currentAbortController = new AbortController();

            const selectedModel = document.getElementById('modelSelect').value;
            let reqApiKey = localStorage.getItem('user_api_key') || null;
            let reqBaseUrl = localStorage.getItem('user_base_url') || null;
            let reqModelName = localStorage.getItem('user_model_name') || null;
            if (selectedModel !== 'custom') {
                reqApiKey = null; reqBaseUrl = null; reqModelName = selectedModel;
            }

            let singleFlush = null;
            let aiToggle = null;   // 兜底用：不管成功失败，别让"正在思考..."永远挂着
            let stepCount = 0;     // 这次执行了几步工具调用（决定按钮要不要显示步数）
            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify({ 
                        message: text, session_id: sessionId,
                        user_api_key: reqApiKey, user_base_url: reqBaseUrl, user_model_name: reqModelName,
                        attachment_id: docId,
                        enable_web_search: document.getElementById('webSearchToggle').checked
                    }),
                    signal: currentAbortController.signal
                });

                thinkingDiv.remove();

                if (!response.ok) {
                    // 限流(429)/鉴权失败等返回的是 JSON 而不是 SSE，以前会一直读空流，
                    // 界面就永远停在"正在思考..."。
                    let detail = '';
                    try { detail = await response.text(); } catch (_) {}
                    throw new Error(`HTTP ${response.status} ${detail.slice(0, 120)}`);
                }
                const aiBubble = document.createElement('div');
                aiBubble.className = 'message ai';
                const textSpan = document.createElement('span'); 
                aiBubble.appendChild(textSpan);
                
                const toggle = document.createElement('div');
                toggle.className = 'thought-toggle';
                toggle.textContent = '正在思考...';
                toggle.style.display = 'block';
                aiToggle = toggle;
                const thoughtDiv = document.createElement('div');
                thoughtDiv.className = 'thought-content';
                thoughtDiv.style.display = 'block';
                
                toggle.onclick = () => {
                    const isShow = thoughtDiv.style.display === 'block';
                    thoughtDiv.style.display = isShow ? 'none' : 'block';
                    toggle.textContent = isShow ? ('查看执行过程' + (stepCount ? '（' + stepCount + ' 步）' : '')) : '收起执行过程';
                };
                aiBubble.appendChild(toggle);
                aiBubble.appendChild(thoughtDiv);
                chatMessages.appendChild(aiBubble);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                let thoughtQueue = "";
                let contentQueue = "";

                // 关键：把队列里剩余的字一次性补齐。
                // 旧实现只在 interval 里判断停止标志，而 finally 先 clearInterval，
                // 那个补齐分支永远执行不到，短回答（计算/时间）会直接空白。
                singleFlush = () => {
                    if (thoughtQueue) { thoughtDiv.textContent += thoughtQueue; thoughtQueue = ""; }
                    if (contentQueue) { textSpan.textContent += contentQueue; contentQueue = ""; }
                    if (textSpan.textContent) { textSpan.innerHTML = renderMarkdown(textSpan.textContent); }
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                };

                if (window.singleTypingInterval) clearInterval(window.singleTypingInterval);
                window.singleTypingInterval = setInterval(() => {
                    if (thoughtQueue.length > 0) {
                        let step = thoughtQueue.length > 50 ? 5 : 1;
                        thoughtDiv.textContent += thoughtQueue.slice(0, step);
                        thoughtQueue = thoughtQueue.slice(step);
                    } else if (contentQueue.length > 0) {
                        let step = contentQueue.length > 50 ? 5 : 1;
                        textSpan.textContent += contentQueue.slice(0, step);
                        contentQueue = contentQueue.slice(step);
                    }
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 15);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const payload = JSON.parse(line.replace("data: ", ""));
                            if (payload.event === 'thinking_start') { thoughtDiv.textContent = ""; thoughtQueue = ""; stepCount = 0; } 
                            else if (payload.event === 'thinking') { thoughtQueue += payload.data; } 
                            else if (payload.event === 'steps') {
                                // 结构化执行步骤：工具名 / 参数 / 耗时 / 结果，渲染成卡片
                                stepCount = (payload.data || []).length;
                                thoughtDiv.innerHTML = renderSteps(payload.data);
                            } 
                            else if (payload.event === 'thinking_done') { 
                                // 这次没有任何思考内容（没调工具、也没执行链）：
                                // 直接把"查看思考过程"藏掉，别留个空框子
                                if (payload.empty) { toggle.style.display = 'none'; thoughtDiv.style.display = 'none'; }
                                else { toggle.textContent = '查看执行过程' + (stepCount ? '（' + stepCount + ' 步）' : ''); }
                            } 
                            else if (payload.event === 'content') { 
                                if (toggle.textContent === '正在思考...') toggle.textContent = '查看执行过程' + (stepCount ? '（' + stepCount + ' 步）' : '');
                                contentQueue += payload.data; 
                            } 
                            else if (payload.event === 'done') {
                                sessionId = payload.session_id;
                                localStorage.setItem('agent_session_id', sessionId);
                                await loadSessionList();
                            } 
                            else if (payload.event === 'error') { textSpan.textContent = "服务异常：" + payload.data; }
                        }
                    }
                }
            } catch (e) {
                thinkingDiv.remove();
                if (e.name !== 'AbortError') addMessage('请求失败：' + (e.message || '请检查服务是否在运行'), 'ai');
            } finally {
                if (window.singleTypingInterval) clearInterval(window.singleTypingInterval);
                window.singleTypingInterval = null;
                if (singleFlush) singleFlush();   // 补完队列里剩下的字符

                // 兜底：无论成功、报错还是被中断，都不留下"正在思考..."挂在界面上
                if (aiToggle && aiToggle.textContent.indexOf('正在思考') === 0) {
                    aiToggle.textContent = stepCount ? ('查看执行过程（' + stepCount + ' 步）') : '查看执行过程';
                }
                thinkingDiv.remove();
                
                updateButtonState(false); 
                currentAbortController = null;
                userInput.focus();
            }
        }

        function quickSend(text) { userInput.value = text; sendMessage(); }
        function addMessage(content, role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'assistant' ? 'ai' : role}`;
            if (role === 'assistant') {
                // 历史里的回答也要按 Markdown 渲染，否则 **加粗** 会原样显示
                const body = document.createElement('div');
                body.className = 'markdown-body';
                body.innerHTML = renderMarkdown(content);
                msgDiv.appendChild(body);
            } else {
                msgDiv.textContent = content;
            }
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function loadSessionList() {
            try {
                const res = await fetch('/sessions', { headers: { 'X-API-Key': API_KEY } });
                const data = await res.json();
                sessionList.innerHTML = '';
                if (data.code === 200) {
                    data.data.forEach(s => {
                        const div = document.createElement('div');
                        const isGrp = !!localStorage.getItem('group_cfg_' + s.session_id);
                        div.className = `session-item ${s.session_id === sessionId ? 'active' : ''}`;
                        div.innerHTML = `<span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; margin-right: 8px;">${isGrp ? '🧠' : '💬'} ${s.title || '新会话'}</span><span style="font-size: 11px; color: #9ca3af; flex-shrink: 0;">${s.updated_at}</span>`;
                        div.onclick = () => switchSession(s.session_id);
                        sessionList.appendChild(div);
                    });
                }
            } catch (e) { console.error('加载列表失败', e); }
        }
        
        async function switchSession(id) {
            if (isGenerating) return;
            sessionId = id;
            localStorage.setItem('agent_session_id', id);
            restoreGroupConfig(id);   // 研讨会话切回来仍然显示主/副模型
            updateLayoutForMode();
            await loadHistory(id);
            await loadSessionList();
        }
        
        // ==================== 研讨历史还原（和实时渲染同一套样式） ====================
        function histBlock(round, label, map) {
            if (map.has(round)) return map.get(round);
            const block = document.createElement('div');
            block.className = 'round-block';
            const divider = document.createElement('div');
            divider.className = 'stage-divider';
            divider.textContent = '— ' + label + ' —';
            block.appendChild(divider);
            chatMessages.appendChild(block);
            map.set(round, block);
            return block;
        }

        function histSpeak(round, model, content, map) {
            const label = round === 2 ? '第二轮：交叉研讨' : '第一轮：专家独立作答';
            const block = histBlock(round, label, map);
            const visual = getModelVisual(model);
            const wrapper = document.createElement('div');
            wrapper.className = 'discussion-msg';
            wrapper.innerHTML = `
                <div class="model-avatar" style="color: ${visual.color}; border: 1px solid ${visual.color}50;">${visual.icon}</div>
                <div class="model-content-wrapper">
                    <div class="model-name-tag" style="color: ${visual.color};">${escapeHtml(visual.name)}${round === 2 ? ' · 研讨' : ''}</div>
                    <div class="markdown-body message-text">${renderMarkdown(content || '')}</div>
                </div>`;
            block.appendChild(wrapper);
        }

        function histSummary(model, content, map) {
            const block = histBlock(3, '首席总结', map);
            const visual = getModelVisual(model);
            const wrapper = document.createElement('div');
            wrapper.className = 'summary-msg';
            wrapper.innerHTML = `
                <div class="summary-title">👑 首席总结 (${escapeHtml(visual.name)})</div>
                <div class="markdown-body message-text">${renderMarkdown(content || '')}</div>`;
            block.appendChild(wrapper);
        }

        function histDivergence(content) {
            const wrapper = document.createElement('div');
            wrapper.className = 'summary-msg';
            wrapper.innerHTML = '<div class="summary-title">🔍 共识与分歧（自动分析）</div>' +
                '<div class="markdown-body message-text">' + renderMarkdown(content || '') + '</div>';
            chatMessages.appendChild(wrapper);
        }

        async function loadHistory(id) {
            chatMessages.innerHTML = '<div class="message ai">正在加载历史记录...</div>';
            try {
                const res = await fetch(`/sessions/${id}/messages`, { headers: { 'X-API-Key': API_KEY } });
                const data = await res.json();
                chatMessages.innerHTML = '';
                if (data.code === 200 && data.data.length > 0) {
                    const groupBlocks = new Map();
                    data.data.forEach(m => {
                        const tp = m.thought_process || '';
                        if (tp.startsWith('GROUP_SPEAK:')) {
                            const parts = tp.split(':');
                            histSpeak(parseInt(parts[1], 10) || 1, parts.slice(2).join(':'), m.content, groupBlocks);
                        } else if (tp.startsWith('GROUP_SUMMARY:')) {
                            histSummary(tp.slice('GROUP_SUMMARY:'.length), m.content, groupBlocks);
                        } else if (tp.startsWith('GROUP_DIVERGENCE:')) {
                            histDivergence(m.content);
                        } else {
                            addMessage(m.content, m.role);
                        }
                    });
                } else {
                    chatMessages.innerHTML = '<div class="message ai">历史记录为空。</div>';
                }
            } catch (e) { chatMessages.innerHTML = '<div class="message ai">加载失败。</div>'; }
        }

            document.getElementById('userBaseUrl').value = localStorage.getItem('user_base_url') || '';

        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        // 逐个探测 .env 里注册的模型：没配 Key / Key 失效 / 额度用完 / 模型名写错，一眼看出来
        async function checkModelHealth() {
            const box = document.getElementById('healthResult');
            box.innerHTML = '正在检测（每个模型发一次最小请求，最多约 15 秒）...';
            try {

                    return `<div style="margin-bottom:6px;">${icon} <b>${escapeHtml(m.model_id)}</b> — <span style="color:${color}">${escapeHtml(m.detail)}</span></div>`;
                }).join('');

        function changeProvider() {
            const provider = document.getElementById('llmProvider').value;
            const urlInput = document.getElementById('userBaseUrl');
            const modelInput = document.getElementById('userModelName');
            if (provider === 'qwen') { urlInput.value = 'https://dashscope.aliyuncs.com/compatible-mode/v1'; modelInput.value = 'qwen-plus'; }
            else if (provider === 'glm') { urlInput.value = 'https://open.bigmodel.cn/api/paas/v4/'; modelInput.value = 'glm-4-flash'; }
