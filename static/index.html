<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多工具智能助手 Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 1100px; height: 92vh; display: flex; gap: 16px; position: relative; }
        .sidebar { width: 260px; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #f0f0f0; }
        .new-chat-btn { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .new-chat-btn:hover { background: #1d4ed8; }
        .session-list { flex: 1; overflow-y: auto; padding: 10px; }
        .session-item { padding: 10px 12px; margin-bottom: 6px; border-radius: 8px; font-size: 13px; color: #374151; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .session-item:hover { background: #f3f4f6; }
        .session-item.active { background: #eff6ff; color: #2563eb; font-weight: 500; }
        .chat-container { flex: 1; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .chat-header { background: #2563eb; color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: flex-start; }
        .chat-header .title { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
        .chat-header .subtitle { font-size: 13px; opacity: 0.85; }
        .settings-btn { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .settings-btn:hover { background: rgba(255,255,255,0.3); }
        .quick-btns { padding: 12px 24px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-btn { padding: 6px 12px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; font-size: 13px; color: #374151; cursor: pointer; transition: all 0.2s; }
        .quick-btn:hover { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .chat-messages { flex: 1; padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 72%; padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
        .message.user { align-self: flex-end; background: #dbeafe; color: #1e3a8a; border-bottom-right-radius: 3px; }
        .message.ai { align-self: flex-start; background: #f3f4f6; color: #1f2937; border-bottom-left-radius: 3px; }
        .thinking { align-self: flex-start; background: #f3f4f6; color: #6b7280; font-size: 14px; padding: 10px 14px; border-radius: 10px; }
        .thinking-dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; margin-right: 3px; animation: bounce 1.4s infinite ease-in-out both; }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .thought-toggle { font-size: 12px; color: #6b7280; cursor: pointer; margin-top: 8px; text-decoration: underline; display: none; user-select: none;}
        .thought-content { margin-top: 8px; padding: 10px; background: #ffffff; border-radius: 6px; font-size: 12px; font-family: Consolas, monospace; white-space: pre-wrap; display: none; border: 1px solid #e5e7eb; max-height: 250px; overflow-y: auto;}
        .chat-input-area { padding: 16px 24px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; }
        #userInput { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
        #sendBtn { padding: 0 22px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        #sendBtn:disabled { background: #93c5fd; cursor: not-allowed; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 24px; border-radius: 12px; width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .modal-content h3 { margin-bottom: 16px; font-size: 18px; color: #1f2937; }
        .modal-content label { font-size: 13px; color: #4b5563; font-weight: 500; }
        .modal-content input { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 16px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .modal-content input:focus { border-color: #2563eb; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .modal-btns button { padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; }
        .btn-cancel { background: #f3f4f6; color: #374151; }
        .btn-save { background: #2563eb; color: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">+ 新建对话</button>
            </div>
            <div class="session-list" id="sessionList"></div>
        </div>
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <div class="title">智能助手 · 多工具 Agent</div>
                    <div class="subtitle">基于 LangGraph + ReAct | 深度流式输出</div>
                </div>
                <button class="settings-btn" onclick="openSettings()">⚙️ 模型配置</button>
            </div>
            <div class="quick-btns">
                <button class="quick-btn" onclick="quickSend('北京天气怎么样')">北京天气怎么样</button>
                <button class="quick-btn" onclick="quickSend('计算 (12+28)*3')">计算 (12+28)*3</button>
                <button class="quick-btn" onclick="quickSend('现在几点')">现在几点</button>
                <button class="quick-btn" onclick="quickSend('帮我查一下核心硬件的型号是什么？')">查设备型号</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="输入你的问题，按回车发送..." autocomplete="off">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h3>自定义模型配置</h3>
            <label>自定义接口地址 (可选)</label>
            <input type="text" id="userBaseUrl" placeholder="例如：https://api.deepseek.com/v1">
            <label>API Key (仅保存在您本地浏览器)</label>
            <input type="password" id="userApiKey" placeholder="sk-...">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn-save" onclick="saveSettings()">保存配置</button>
            </div>
        </div>
    </div>
    <script>
        let sessionId = localStorage.getItem('agent_session_id') || null;
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionList = document.getElementById('sessionList');
        const API_KEY = 'my-secret-key-123';

        function openSettings() {
            document.getElementById('userApiKey').value = localStorage.getItem('user_api_key') || '';
            document.getElementById('userBaseUrl').value = localStorage.getItem('user_base_url') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }
        function saveSettings() {
            const key = document.getElementById('userApiKey').value.trim();
            const url = document.getElementById('userBaseUrl').value.trim();
            localStorage.setItem('user_api_key', key);
            localStorage.setItem('user_base_url', url);
            closeSettings();
            alert('配置已保存在本地！');
        }

        async function init() {
            await loadSessionList();
            if (sessionId) {
                await loadHistory(sessionId);
            } else {
                createNewChat();
            }
        }

        function createNewChat() {
            sessionId = null;
            localStorage.removeItem('agent_session_id');
            chatMessages.innerHTML = '<div class="message ai">你好！我已经准备好了。你可以问我天气、算数、时间，或者查阅内部知识库。</div>';
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            userInput.focus();
        }

        async function loadSessionList() {
            try {
                const res = await fetch('/sessions', { headers: { 'X-API-Key': API_KEY } });
                const data = await res.json();
                sessionList.innerHTML = '';
                if (data.code === 200) {
                    data.data.forEach(s => {
                        const div = document.createElement('div');
                        div.className = `session-item ${s.session_id === sessionId ? 'active' : ''}`;
                        div.innerHTML = `<span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; margin-right: 8px;" title="${s.title || '新会话'}">${s.title || '新会话'}</span><span style="font-size: 11px; color: #9ca3af; flex-shrink: 0;">${s.updated_at}</span>`;
                        div.onclick = () => switchSession(s.session_id);
                        sessionList.appendChild(div);
                    });
                }
            } catch (e) { console.error('加载会话列表失败', e); }
        }

        async function switchSession(id) {
            sessionId = id;
            localStorage.setItem('agent_session_id', id);
            await loadHistory(id);
            await loadSessionList();
        }

        async function loadHistory(id) {
            chatMessages.innerHTML = '<div class="message ai">正在加载历史记录...</div>';
            try {
                const res = await fetch(`/sessions/${id}/messages`, { headers: { 'X-API-Key': API_KEY } });
                const data = await res.json();
                chatMessages.innerHTML = '';
                
                if (data.code === 200 && data.data.length > 0) {
                    data.data.forEach(m => {
                        addMessage(m.content, m.role, m.thought_process);
                    });
                } else {
                    chatMessages.innerHTML = '<div class="message ai">历史记录为空。</div>';
                }
            } catch (e) {
                chatMessages.innerHTML = '<div class="message ai">加载历史记录失败。</div>';
            }
        }

        function addMessage(content, role, thought = null) {
            const msgDiv = document.createElement('div');
            const displayRole = (role === 'assistant') ? 'ai' : role;
            msgDiv.className = `message ${displayRole}`;
            
            const textSpan = document.createElement('span');
            textSpan.textContent = content;
            msgDiv.appendChild(textSpan);

            if (thought && displayRole === 'ai') {
                const toggle = document.createElement('div');
                toggle.className = 'thought-toggle';
                toggle.style.display = 'block';
                toggle.textContent = '查看思考过程';
                
                const thoughtDiv = document.createElement('div');
                thoughtDiv.className = 'thought-content';
                thoughtDiv.textContent = thought;
                
                toggle.onclick = () => {
                    const isShow = thoughtDiv.style.display === 'block';
                    thoughtDiv.style.display = isShow ? 'none' : 'block';
                    toggle.textContent = isShow ? '查看思考过程' : '收起思考过程';
                };
                msgDiv.appendChild(toggle);
                msgDiv.appendChild(thoughtDiv);
            }
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return { msgDiv, textSpan };
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.innerHTML = '正在思考<span class="thinking-dots"><span></span><span></span><span></span></span>';
            chatMessages.appendChild(thinkingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify({ 
                        message: text, 
                        session_id: sessionId,
                        user_api_key: localStorage.getItem('user_api_key') || null,
                        user_base_url: localStorage.getItem('user_base_url') || null
                    })
                });

                thinkingDiv.remove(); 
                const aiBubble = document.createElement('div');
                aiBubble.className = 'message ai';
                const textSpan = document.createElement('span');
                aiBubble.appendChild(textSpan);
                
                const toggle = document.createElement('div');
                toggle.className = 'thought-toggle';
                toggle.textContent = '正在思考...';
                
                const thoughtDiv = document.createElement('div');
                thoughtDiv.className = 'thought-content';
                
                toggle.onclick = () => {
                    const isShow = thoughtDiv.style.display === 'block';
                    thoughtDiv.style.display = isShow ? 'none' : 'block';
                    toggle.textContent = isShow ? '查看思考过程' : '收起思考过程';
                };
                aiBubble.appendChild(toggle);
                aiBubble.appendChild(thoughtDiv);
                chatMessages.appendChild(aiBubble);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                
                let thinkingQueue = "";
                let answerQueue = "";
                let isTypingThinking = true;
                
                const typingInterval = setInterval(() => {
                    if (isTypingThinking) {
                        if (thinkingQueue.length > 0) {
                            thoughtDiv.textContent += thinkingQueue.charAt(0);
                            thinkingQueue = thinkingQueue.slice(1);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    } else {
                        if (answerQueue.length > 0) {
                            textSpan.textContent += answerQueue.charAt(0);
                            answerQueue = answerQueue.slice(1);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    }
                }, 15);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const payload = JSON.parse(line.replace("data: ", ""));
                            
                            if (payload.event === 'thinking_start') {
                                toggle.style.display = 'block';
                                thoughtDiv.style.display = 'block';
                                thoughtDiv.textContent = "";
                                isTypingThinking = true;
                            } else if (payload.event === 'thinking') {
                                thinkingQueue += payload.data;
                            } else if (payload.event === 'thinking_done') {
                                const checkQueue = setInterval(() => {
                                    if (thinkingQueue.length === 0) {
                                        clearInterval(checkQueue);
                                        toggle.textContent = '收起思考过程';
                                        isTypingThinking = false; // 切换到回答模式
                                    }
                                }, 50);
                            } else if (payload.event === 'content') {
                                // 如果因为某些原因没收到 thinking_done，这里做个兜底强制切换
                                if (isTypingThinking && thinkingQueue.length === 0) {
                                    isTypingThinking = false;
                                    if (thoughtDiv.textContent === "") toggle.style.display = 'none';
                                }
                                answerQueue += payload.data;
                            } else if (payload.event === 'done') {
                                sessionId = payload.session_id;
                                localStorage.setItem('agent_session_id', sessionId);
                                await loadSessionList();
                            } else if (payload.event === 'error') {
                                textSpan.textContent = "服务异常：" + payload.data;
                            }
                        }
                    }
                }
                
                const waitRender = setInterval(() => {
                    if (thinkingQueue.length === 0 && answerQueue.length === 0) {
                        clearInterval(waitRender);
                        clearInterval(typingInterval);
                    }
                }, 100);

            } catch (e) {
                thinkingDiv.remove();
                addMessage('网络连接失败，请检查服务是否启动。', 'ai');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function quickSend(text) { userInput.value = text; sendMessage(); }
        sendBtn.onclick = sendMessage;
        userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        
        init();
    </script>
</body>
</html>
