<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="400" viewBox="0 0 1260 400" role="img" aria-label="Multi-model debate workflow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1260" height="400" rx="16" fill="#f8fafc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">

    <!-- 用户提问 -->
    <rect x="26" y="150" width="132" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#soft)"/>
    <text x="92" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">User</text>
    <text x="92" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">question</text>
    <line x1="158" y1="200" x2="196" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Round 1 -->
    <rect x="204" y="52" width="256" height="296" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="332" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Round 1 · Independent</text>
    <text x="332" y="106" text-anchor="middle" font-size="12" fill="#6366f1">all staff models answer in parallel</text>
    <g fill="#ffffff" stroke="#c7d2fe">
      <rect x="224" y="124" width="216" height="52" rx="10"/>
      <rect x="224" y="188" width="216" height="52" rx="10"/>
      <rect x="224" y="252" width="216" height="52" rx="10"/>
    </g>
    <g font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">
      <text x="332" y="156">GPT‑6.1</text>
      <text x="332" y="220">Claude Opus 4.6</text>
      <text x="332" y="284">Qwen / GLM / DeepSeek</text>
    </g>
    <line x1="460" y1="200" x2="500" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Round 2 -->
    <rect x="508" y="52" width="256" height="296" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="636" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Round 2 · Cross‑review</text>
    <text x="636" y="106" text-anchor="middle" font-size="12" fill="#8b5cf6">each model reads &amp; critiques the others</text>
    <g fill="#ffffff" stroke="#ddd6fe">
      <rect x="528" y="124" width="216" height="52" rx="10"/>
      <rect x="528" y="188" width="216" height="52" rx="10"/>
      <rect x="528" y="252" width="216" height="52" rx="10"/>
    </g>
    <g font-size="12" fill="#4c1d95" text-anchor="middle">
      <text x="636" y="148">finds gaps in the other two</text>
      <text x="636" y="156" font-size="0"></text>
      <text x="636" y="212">agrees / disagrees with evidence</text>
      <text x="636" y="276">fills in what was missed</text>
    </g>
    <line x1="764" y1="200" x2="804" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Round 3 -->
    <rect x="812" y="52" width="204" height="296" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="914" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Round 3 · Chief</text>
    <text x="914" y="106" text-anchor="middle" font-size="12" fill="#059669">one model merges everything</text>
    <rect x="832" y="150" width="164" height="100" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="914" y="188" text-anchor="middle" font-size="12.5" fill="#1e293b">drops wrong claims</text>
    <text x="914" y="210" text-anchor="middle" font-size="12.5" fill="#1e293b">keeps the consensus</text>
    <line x1="1016" y1="200" x2="1056" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 输出 -->
    <rect x="1064" y="150" width="170" height="100" rx="14" fill="#0f172a" filter="url(#soft)"/>
    <text x="1149" y="188" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f8fafc">streamed to browser</text>
    <text x="1149" y="212" text-anchor="middle" font-size="12" fill="#94a3b8">SSE · no refresh</text>
  </g>
</svg>
