name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 测试全部离线：不调用任何模型。给一份假注册表，让分层/价格类用例有东西可查
      MODEL_REGISTRY: '{"dummy":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"t","label":"Dummy","model":"dummy-1"}}'
      OPENAI_API_KEY: dummy
      OPENAI_BASE_URL: https://example.invalid/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # 只装测试用得到的包：不装 torch / faiss，否则要跑几分钟
          pip install pytest ruff fastapi openai python-dotenv pypdf sqlalchemy

      - name: 语法检查（编译全部源码）
        run: python -m compileall -q app scripts tests

      - name: 静态检查（未定义名字 / 语法）
        run: ruff check app scripts tests

      - name: 单元测试
        run: pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（验证 Dockerfile 可用）
        run: docker build -t multi-model-agent-debate:ci .
