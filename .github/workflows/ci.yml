name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 测试全部离线：不调用任何模型，注册表用假配置也能跑结构类用例
      MODEL_REGISTRY: '{"dummy":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"t","label":"Dummy"}}'
      OPENAI_API_KEY: dummy
      OPENAI_BASE_URL: https://example.invalid/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装轻量依赖
        run: |
          python -m pip install --upgrade pip
          # 测试只依赖解析器与纯函数，不装 torch / faiss，装全套要几分钟
          pip install pytest ruff pydantic pydantic-settings python-dotenv fastapi httpx openai pypdf

      - name: 代码检查（语法 + 未定义名字）
        run: ruff check app scripts tests

      - name: 单元测试
        run: pytest tests -q --deselect tests/test_divergence.py::test_render_groups_same_stance_together 2>/dev/null || pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（只验证 Dockerfile 可用）
        run: docker build -t multi-model-agent-debate:ci .
