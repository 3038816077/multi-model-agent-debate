name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 测试完全离线：不调用任何模型。这里的假注册表刻意用和真实 .env 相同的 key，
      # 否则「分层引用的模型必须在注册表里」这类用例会误报（CI 没有 .env）
      MODEL_REGISTRY: '{"glm-4-flash":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"智谱","label":"GLM-4-Flash"},"glm-4.6":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"智谱","label":"GLM-4.6","model":"glm-4.6"},"kimi-k2.7-code":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"月之暗面","label":"Kimi K2.7 Code","model":"kimi-k2.7-code"},"deepseek-v4-pro":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"深度求索","label":"DeepSeek V4 Pro","model":"deepseek-v4-pro"},"qwen4-max":{"base_url":"https://example.invalid/v1","api_key":"test-key","vendor":"阿里","label":"Qwen4 Max","model":"qwen4-max"}}'
      OPENAI_API_KEY: dummy
      OPENAI_BASE_URL: https://example.invalid/v1
      API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装测试依赖（不含模型运行时）
        run: |
          python -m pip install --upgrade pip
          # 单元测试只验证纯逻辑；torch / faiss / langchain / jieba 由 tests/_stubs.py 替身，
          # 真实依赖的冒烟交给下面的 docker-build job。
          pip install pytest ruff fastapi sqlalchemy pydantic openai python-dotenv pypdf slowapi requests httpx

      - name: 语法检查
        run: python -m compileall -q app scripts tests

      - name: 静态检查（未定义名字 / 语法错误）
        run: ruff check app scripts tests

      - name: 单元测试
        run: python -m pytest tests -q -x --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像并验证依赖装得全
        run: |
          docker build \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            -t multi-model-agent-debate:ci .
